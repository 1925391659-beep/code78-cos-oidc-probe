name: api OIDC proof
on: workflow_dispatch
permissions: {}
jobs:
  verify:
    if: github.repository_id == vars.PROBE_REPOSITORY_ID && github.ref == 'refs/heads/code78-oidc-probe' && github.ref_protected && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    environment: code78-cos-api-probe
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: node .github/scripts/verify-oidc.mjs api
        env:
          PROBE_REPOSITORY_ID: ${{ vars.PROBE_REPOSITORY_ID }}
          PROBE_REPOSITORY: ${{ github.repository }}
          PROBE_OWNER_ID: ${{ github.repository_owner_id }}
